aid: integral-geometry-science
name: Integral Geometry Science
description: >-
  Integral Geometry Science Inc. (IGS) is a Kobe University deep-tech spinout founded on
  2 April 2012 by Dr. Kenjiro Kimura, who published the first analytical solution to the
  inverse problem of wave scattering. IGS turns that mathematics into measurement hardware
  and imaging software that makes the inside of an object visible without cutting it open:
  microwave mammography for painless, radiation-free breast cancer screening (designated
  under Japan's Sakigake scheme), non-destructive current-density imaging for rechargeable
  battery inspection, walk-through security screening for concealed hazardous materials,
  and rebar corrosion and fracture inspection for civil infrastructure. The company is
  headquartered in Kobe, Hyogo, Japan, holds patents across Japan, the United States,
  China and Europe, and is backed by SBI Investment and Japan's NEDO deep-tech program.
  IGS sells instruments and diagnostic systems to hospitals, manufacturers and
  infrastructure operators; it publishes no public developer program, API, or SDK.
